name: Release

# Push a tag like v0.2.0 to publish static binaries (and the Flipper boot
# image) with SHA256 checksums on the GitHub Releases page.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          cargo test --locked
          mkdir dist
          for t in x86_64 aarch64; do
            cargo build --release --locked --target $t-unknown-linux-musl
            cp target/$t-unknown-linux-musl/release/wtf-check dist/wtf-check-$t
          done
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/

  flipper-image:
    needs: binaries
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/
      - name: Build Flipper boot image (Arch kernel + mkinitcpio)
        run: |
          pacman -Syu --noconfirm --needed linux mkinitcpio systemd cryptsetup lvm2 btrfs-progs xfsprogs util-linux dosfstools mtools
          chmod +x dist/wtf-check-x86_64
          ./flipper/build-flipper-image.sh --wtf-check dist/wtf-check-x86_64 --out dist/wtf-check-flipper.img
      - uses: actions/upload-artifact@v4
        with:
          name: flipper
          path: dist/wtf-check-flipper.img

  publish:
    needs: [binaries, flipper-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum wtf-check-* > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes wtf-check-* SHA256SUMS
